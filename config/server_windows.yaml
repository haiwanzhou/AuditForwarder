# AuditForwarder - Windows 服务端测试配置

agent:
  id: "auditforwarder-server"
  data_dir: data/server
  config_path: config/server_windows.yaml

log:
  level: debug
  file: data/server/server.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: "server-test-hmac-key"

transport:
  servers: []
  auth_token: "test-token-12345"
  verify_tls: false

remote:
  enabled: false
  servers: []

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: false

self_protect:
  enabled: false

manager:
  enabled: true
  listen: 0.0.0.0:8443
  auth_token: "test-token-12345"
  login_username: "admin"
  login_password_sha256: "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"
  enrollment_key: "specific_key"
  max_host_count: 1000
  use_tls: false
  require_client_cert: false
  tls_crl_check: false

collectors:
  enabled: false

processors:
  - type: enricher
