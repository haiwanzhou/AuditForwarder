# AuditForwarder - Windows 测试配置

# ---------------------------------------------------------------------------
# 全局设置
# ---------------------------------------------------------------------------
agent:
  id: "test-agent-001"
  data_dir: data
  config_path: config/agent_windows.yaml

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
log:
  level: debug
  file: data/agent.log
  max_bytes: 52428800
  max_backups: 5

# ---------------------------------------------------------------------------
# 事件链
# ---------------------------------------------------------------------------
chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: ""                 # 如需 HMAC 签名请自行配置，禁止提交真实密钥

# ---------------------------------------------------------------------------
# 传输（暂时禁用，避免连接失败）
# ---------------------------------------------------------------------------
transport:
  servers: []
  mode: batch
  interval_sec: 60
  compress: false
  encrypt_payload: false
  auth_token: ""
  verify_tls: false

# ---------------------------------------------------------------------------
# Agent 主动连接中心服务
# ---------------------------------------------------------------------------
remote:
  enabled: true
  servers:
    - "http://127.0.0.1:8443"
  host_id: "test-agent-001"
  heartbeat_interval_sec: 10
  command_poll_interval_sec: 5
  audit_summary_interval_sec: 15
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: ""           # 与服务端 manager.enrollment_key 保持一致；生产环境必须自行配置
  allowed_commands:
    - collect_status
    - echo

# ---------------------------------------------------------------------------
# 检测
# ---------------------------------------------------------------------------
detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

# ---------------------------------------------------------------------------
# 自我保护（Windows测试时禁用，避免权限问题）
# ---------------------------------------------------------------------------
self_protect:
  enabled: false
  check_interval_sec: 10
  watchdog: false

# ---------------------------------------------------------------------------
# 管理后台
# ---------------------------------------------------------------------------
manager:
  enabled: true
  listen: 127.0.0.1:8443
  auth_token: ""
  enrollment_key: ""           # 与服务端保持一致；生产环境必须自行配置
  use_tls: false
  require_client_cert: false
  tls_crl_check: false

# ---------------------------------------------------------------------------
# 采集器（测试时部分禁用）
# ---------------------------------------------------------------------------
collectors:
  enabled: true

  file:
    enabled: false

  process:
    enabled: false

  network:
    enabled: false

  command:
    enabled: false

  audit:
    enabled: false

# ---------------------------------------------------------------------------
# 处理器
# ---------------------------------------------------------------------------
processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
  - type: sampler
    keep_ratio: 1.0
