# AuditForwarder 客户端配置模板
#
# 首次使用：把 <...> 换成你自己的值。全留空也能跑起来，只是连不上服务端。
# 也可以由 GUI 生成（GUI 会把结果写回本文件）。
#
# 多机部署（两个管理员各一台机器）要点：
#   1. 每台机器的 agent.id / remote.host_id 必须**互不相同**。
#      证据链靠 host_id 区分「这一步是哪台机器做的」，写重了两个人的操作会混成一个人，
#      跨操作员合谋永远不成立（distinct_op_count 凑不满 2）。
#   2. agent.data_dir 每台机器也要分开，否则本地队列会互相覆盖。
#   3. collector.http_proxy.target_hosts 要填「被监管系统的 IP」，
#      且**不支持 CIDR**（写 192.168.1.0/24 无效），端口会被忽略、只比主机名。
agent:
  id: ""
  data_dir: data/client
  config_path: "config/client_windows.yaml"

# 操作员身份（M5 身份贯通）：本机操作员标识，随心跳/事件上报，
# 服务端据此登记「操作员 ↔ 主机」绑定关系
operator:
  id: ""
  name: ""

log:
  level: info
  file: data/client/client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: ""                      # 必须与服务端 manager 验签密钥一致（双方为空则跳过验签）

transport:
  servers:
    - "http://<SERVER_IP>:8443/ingest?agent="
  mode: realtime
  interval_sec: 5
  compress: true
  encrypt_payload: false
  auth_token: ""
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://<SERVER_IP>:8443"
  host_id: ""                       # 必须全局唯一，见文件头说明
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 5
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: ""                # 注册密钥，请与服务端 manager.enrollment_key 保持一致
  allowed_commands:
    - collect_status
    - echo
    - set_collector
    - set_collectors
    - load_rules

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: ""

collectors:
  enabled: true
  # 采集器降噪（借鉴 Sysmon 的 Include/Exclude、osquery 的事件白名单、Zeek conn.log 单次记录）：
  # 所有列表留空则使用内置默认值，默认值已按「无检测价值的背景噪声」调优。
  filter:
    file:
      paths: []              # 空 = 用户桌面/文档/下载（Windows）或 主目录+/etc（Linux）
      include: []            # 允许模式（空 = 全部允许）
      exclude: []            # 排除模式（空 = 内置：构建目录/缓存/临时/日志/采集端 data 目录）
      coalesce_ms: 2000      # 同一文件同一动作的重复写合并窗口，0 = 不去重
    process:
      exclude_images: []     # 空 = 内置系统管道进程表（conhost/svchost/searchhost...）
      emit_exit: false       # 是否上报进程退出（分析合谋一般不需要）
    network:
      include_loopback: false   # 排除 127.0.0.1 / ::1 等本机回环连接
      only_established: true    # 只保留 ESTABLISHED，排除 LISTEN/TIME_WAIT 等状态
      emit_only_new: true       # 同一连接只上报一次（新连接或状态变化）
      poll_ms: 2000             # 连接表轮询间隔
      exclude_remote_ports: []  # 例：[137, 138, 139] 排除 NetBIOS 噪声
    etw:
      event_ids: [4624, 4625, 4688]   # 登录成功/失败/进程创建
      logon_types: [2, 10, 11]        # 保留交互式/远程交互/缓存交互，排除服务账户(3/5)
      skip_machine_accounts: true     # 跳过以 $ 结尾的机器账户
      skip_system: true               # 跳过 SYSTEM
      extract_command_line: true      # 4688 提取命令行（需开启进程创建审计策略）
  # M5-3 本地 HTTP 代理行为采集：把浏览器代理指向 127.0.0.1:<listen_port>
  # 即可采集 operator 对受管系统的 HTTP 操作（method/host/uri/status_code/body_len）
  http_proxy:
    enabled: false          # 未配置时默认关闭；也可由服务端远程开启
    bind: 127.0.0.1         # 仅本机回环
    listen_port: 8888
    capture_body: false     # 开启后请求体存入 attrs（经 PIIMasker 脱敏）
    target_hosts: []        # 空=采集全部主机；建议显式填被监管系统 IP，例：["10.0.0.5"]

# 高权限操作检测：Windows 识别 UAC 提权令牌与 SYSTEM(S-1-5-18)，Linux 识别 uid=0；
# 命中的事件打 priority=high 并走传输紧急通道。
privilege_detect:
  enabled: true

# 测试注入（仅测试环境，生产必须保持 false）：
# 周期性合成 etw_win 富字段事件与 SYSTEM/elevated 高权限事件，走完整采集链路。
test_injection:
  enabled: false
  interval_ms: 1000

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
