# AuditForwarder - Windows 客户端测试配置

agent:
  id: "test-agent-001"
  data_dir: C:\Users\30952\Desktop\AuditForwarder\data\client
  config_path: C:\Users\30952\Desktop\AuditForwarder\config\client_windows.yaml

log:
  level: debug
  file: C:\Users\30952\Desktop\AuditForwarder\data\client\client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: "client-test-hmac-key"

transport:
  servers: []
  mode: batch
  interval_sec: 60
  compress: false
  encrypt_payload: false
  auth_token: "test-token-12345"
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://127.0.0.1:8443"
  host_id: "test-agent-001"
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 10
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: "specific_key"
  allowed_commands:
    - collect_status
    - echo

detector:
  rules_path: C:\Users\30952\Desktop\AuditForwarder\config\rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: "test-token-12345"

collectors:
  enabled: true

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
