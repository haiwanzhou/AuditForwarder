# AuditForwarder - Windows 客户端测试配置

agent:
  id: "test-agent-001"
  data_dir: data/client
  config_path: config/client_windows.yaml

log:
  level: debug
  file: data/client/client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: "client-test-hmac-key"

transport:
  servers:
    - "http://127.0.0.1:8443/ingest?agent=test-agent-001"
  mode: realtime
  interval_sec: 5
  compress: true
  encrypt_payload: false
  auth_token: "test-token-12345"
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://127.0.0.1:8443"
  host_id: "test-agent-001"
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 5
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: "specific_key"
  allowed_commands:
    - collect_status
    - echo

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: "test-token-12345"

collectors:
  enabled: true

# 高权限操作检测：Windows 识别 UAC 提权令牌与 SYSTEM(S-1-5-18)，Linux 识别 uid=0；
# 命中的事件打 priority=high 并走传输紧急通道。
privilege_detect:
  enabled: true

# 测试注入（仅测试环境，生产必须保持 false）：
# 周期性合成 etw_win 富字段事件与 SYSTEM/elevated 高权限事件，走完整采集链路。
test_injection:
  enabled: false
  interval_ms: 1000

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
