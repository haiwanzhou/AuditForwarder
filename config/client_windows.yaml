# AuditForwarder - Windows 客户端测试配置

agent:
  id: "test-agent-001"
  data_dir: data/client
  config_path: config/client_windows.yaml

log:
  level: debug
  file: data/client/client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: ""                 # 如需 HMAC 签名请自行配置，禁止提交真实密钥

transport:
  servers: []
  mode: batch
  interval_sec: 60
  compress: false
  encrypt_payload: false
  auth_token: ""
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://127.0.0.1:8443"
  host_id: "test-agent-001"
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 10
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: ""           # 与服务端 manager.enrollment_key 保持一致；生产环境必须自行配置
  allowed_commands:
    - collect_status
    - echo

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: ""

collectors:
  enabled: true

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
