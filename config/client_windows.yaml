# AuditForwarder 客户端配置（由 GUI 自动生成）
agent:
  id: ""
  data_dir: data/client
  config_path: "config/client_windows.yaml"

# 操作员身份（M5 身份贯通）：本机操作员标识，随心跳/事件上报，
# 服务端据此登记「操作员 ↔ 主机」绑定关系
operator:
  id: ""
  name: ""

log:
  level: info
  file: data/client/client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: ""

transport:
  servers:
    - "http://26.17.173.34:8443/ingest?agent="
  mode: realtime
  interval_sec: 5
  compress: true
  encrypt_payload: false
  auth_token: ""
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://26.17.173.34:8443"
  host_id: ""
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 5
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: ""
  allowed_commands:
    - collect_status
    - echo
    - set_collector
    - set_collectors
    - load_rules

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: ""

collectors:
  enabled: true

privilege_detect:
  enabled: true

test_injection:
  enabled: false
  interval_ms: 1000

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
