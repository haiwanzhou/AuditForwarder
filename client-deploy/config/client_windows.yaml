# AuditForwarder - 客户端配置（Radmin LAN 跨机器）
# 服务端IP: 26.17.173.34 (清一)
# 本机IP:   26.121.98.221 (zyh_yxy/海挽洲)

agent:
  id: "zyh-yxy-001"
  data_dir: data/client
  config_path: config/client_windows.yaml

log:
  level: info
  file: data/client/client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: ""

transport:
  servers:
    - "http://26.17.173.34:8443/ingest?agent=zyh-yxy-001"
  mode: realtime
  interval_sec: 5
  compress: true
  encrypt_payload: false
  auth_token: ""
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://26.17.173.34:8443"
  host_id: "zyh-yxy-001"
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 5
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: ""
  allowed_commands:
    - collect_status
    - echo
    - set_collector
    - set_collectors
    - load_rules

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: ""

collectors:
  enabled: true

privilege_detect:
  enabled: true

test_injection:
  enabled: false
  interval_ms: 1000

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
